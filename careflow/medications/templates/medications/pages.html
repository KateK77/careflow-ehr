{% if rows.paginator.num_pages > 1 %}
<nav aria-label="Page navigation">
  {% if rows.has_previous %}<a href="?page={{ rows.previous_page_number }}">Previous</a>{% endif %}
  Page {{ rows.number }} of {{ rows.paginator.num_pages }}
  {% if rows.has_next %}<a href="?page={{ rows.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
