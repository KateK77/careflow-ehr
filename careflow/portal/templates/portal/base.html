{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Patient Portal{% endblock %} · CareFlow EHR</title>
<link rel="stylesheet" href="{% static 'portal/portal.css' %}">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header><strong>CareFlow EHR</strong><span>Patient Portal</span><span class="demo">DEMO — NOT FOR CLINICAL USE</span></header>
{% if patient %}
<nav aria-label="Patient portal">
<a href="{% url 'portal_home' %}">Dashboard</a>
<a href="{% url 'portal_appointments' %}">Appointments</a>
<a href="{% url 'portal_results' %}">Laboratory results</a>
<a href="{% url 'portal_medications' %}">Medications</a>
<a href="{% url 'portal_visits' %}">Visit records</a>
<form method="post" action="{% url 'portal_logout' %}">{% csrf_token %}<button>Sign out</button></form>
</nav>
{% endif %}
<main id="content" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
