<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Literature Search · Round 1</title><link rel="stylesheet" href="style.css"><style>:root{--accent:#1f4f83}</style></head>
<body><header><strong>Literature Search</strong><a href="index.html">All prototypes</a></header><main><section class="hero"><h1>Find biomedical literature</h1><p>PubMed prototype · Search a small sample index</p></section><form id="search" class="card row"><label class="grow">Search terms<input type="search" id="query" placeholder="kidney, semaglutide, or a PMID"></label><label>Publication type<select id="type"><option value="">All types</option><option>Trial</option><option>Review</option></select></label><label>From year<input type="number" id="year" min="1900" max="2100" step="1" placeholder="Any"></label><label>Sort<select id="sort"><option value="">Best match</option><option value="recent">Newest first</option></select></label><button>Search</button><button class="secondary" type="button" id="live">Search on PubMed</button></form><div class="row"><button id="saved" class="secondary" aria-pressed="false">Saved papers</button><p id="count" role="status"></p></div><details class="card"><summary>Advanced search</summary><form id="advanced" class="row"><label class="grow">Title words<input id="title-words" type="search"></label><label class="grow">Journal<input id="journal" type="search"></label><button>Apply fields</button></form></details><button class="secondary" id="export">Export saved PMIDs</button><section id="results" aria-label="Search results"></section></main><script src="data.js"></script><script src="search.js"></script></body></html>
